name: Recuperar UI
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: ID da publicação bem-sucedida de origem
        required: true
        type: string
      source_attempt:
        description: Número da tentativa original
        required: true
        type: string
      source_sha:
        description: SHA completo do artefato conhecido
        required: true
        type: string
      source_version:
        description: Versão do artefato conhecido
        required: true
        type: string
      expected_current_job:
        description: ID do job mais recente da branch Amplify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ github.ref == 'refs/heads/hlg' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'production' || 'hlg' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_VERSION: ${{ inputs.source_version }}
      EXPECTED_CURRENT_JOB: ${{ inputs.expected_current_job }}
      GH_TOKEN: ${{ github.token }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_PAGER: ''
      AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
      AMPLIFY_BRANCH: ${{ vars.AMPLIFY_BRANCH }}
      UI_ORIGIN: ${{ vars.UI_ORIGIN }}
      VITE_API_BASE_URL: ${{ vars.API_ORIGIN }}
      RECOVERY_EVIDENCE: ${{ runner.temp }}/recovery-source/release-evidence.json
      SITE_ARCHIVE: ${{ runner.temp }}/recovery-site/site.zip
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Iniciar evidência
        id: start
        run: |
          source .github/scripts/release_support.sh
          source .github/scripts/recovery_support.sh
          start_recovery_evidence
      - name: Verificar a publicação de origem
        run: |
          source .github/scripts/release_support.sh
          source .github/scripts/recovery_support.sh
          fetch_recovery_evidence "$(dirname "$RECOVERY_EVIDENCE")"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "site-$SOURCE_VERSION-$SOURCE_ATTEMPT" --dir "$(dirname "$SITE_ARCHIVE")"
      - name: Assumir identidade de homologação por OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          unset-current-credentials: true
          role-session-name: recovery-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restaurar e conferir ativação
        id: activation
        run: bash .github/scripts/recover_amplify.sh
      - name: Registrar resultado
        if: ${{ always() && steps.start.outcome == 'success' }}
        env:
          RECOVERY_RESULT: ${{ job.status }}
        run: |
          source .github/scripts/release_support.sh
          record result "$RECOVERY_RESULT"
          record finishedAt "$(date -u +%FT%TZ)"
      - name: Guardar evidência
        if: ${{ always() && steps.start.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-${{ github.run_attempt }}
          path: release-evidence.json
          if-no-files-found: error
