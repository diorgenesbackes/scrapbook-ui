name: Publicar UI em homologação
on:
  push:
    branches: [hlg]

permissions:
  contents: read

concurrency:
  group: publish-hlg
  cancel-in-progress: false

jobs:
  reserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.reserve.outputs.version }}
      run_key: ${{ steps.reserve.outputs.run_key }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Reservar a versão
        id: reserve
        env:
          RELEASE_SERIES: ${{ vars.RELEASE_SERIES }}
          GIT_COMMITTER_NAME: scrapbook-release[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python3 .github/scripts/reserve_release.py "$RELEASE_SERIES" "$GITHUB_SHA" "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"

  build:
    needs: reserve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: hlg
      deployment: false
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.package.outputs.sha256 }}
      api_origin: ${{ steps.package.outputs.api_origin }}
    env:
      RELEASE_VERSION: ${{ needs.reserve.outputs.version }}
      RESERVED_RUN_KEY: ${{ needs.reserve.outputs.run_key }}
      VITE_API_BASE_URL: ${{ vars.API_ORIGIN }}
      VITE_ENABLE_LOCAL_DIAGNOSTICS: 'false'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - run: 'test "$(npm --version)" = 11.20.0'
      - name: Gerar o ZIP de homologação
        id: package
        run: bash .github/scripts/build_amplify.sh
      - name: Guardar o ZIP da tentativa
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site-${{ needs.reserve.outputs.version }}-${{ github.run_attempt }}
          path: site.zip
          if-no-files-found: error

  publish:
    needs: [reserve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: hlg
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.reserve.outputs.version }}
      RESERVED_RUN_KEY: ${{ needs.reserve.outputs.run_key }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_PAGER: ''
      GH_TOKEN: ${{ github.token }}
      AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
      AMPLIFY_BRANCH: ${{ vars.AMPLIFY_BRANCH }}
      UI_ORIGIN: ${{ vars.UI_ORIGIN }}
      VITE_API_BASE_URL: ${{ vars.API_ORIGIN }}
      SITE_SHA256: ${{ needs.build.outputs.sha256 }}
      SITE_API_ORIGIN: ${{ needs.build.outputs.api_origin }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Iniciar o registro da publicação
        id: start
        run: |
          source .github/scripts/release_support.sh
          start_evidence
          printf 'SITE_ARCHIVE=%s/amplify-site/site.zip\n' "${RUNNER_TEMP:?}" >> "${GITHUB_ENV:?}"
      - name: Baixar o ZIP da etapa de build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/amplify-site
      - name: Conferir o ZIP da tentativa
        run: bash .github/scripts/verify_amplify_archive.sh
      - name: Assumir identidade de homologação por OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          unset-current-credentials: true
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publicar e conferir ativação
        id: activation
        run: bash .github/scripts/publish_amplify.sh
      - name: Registrar resultado
        if: ${{ always() && steps.start.outcome == 'success' }}
        env:
          RELEASE_RESULT: ${{ steps.activation.outcome }}
        run: |
          source .github/scripts/release_support.sh
          case "$RELEASE_RESULT" in
            success|failure|skipped|cancelled) record result "$RELEASE_RESULT" ;;
            *) record result "incomplete" ;;
          esac
          record finishedAt "$(date -u +%FT%TZ)"
      - name: Guardar evidência
        if: ${{ always() && steps.start.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ needs.reserve.outputs.version }}-${{ github.run_attempt }}
          path: release-evidence.json
          if-no-files-found: error
