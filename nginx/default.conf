map $uri $scrapbook_route {
    default spa;
    / home;
    /ui-health /ui-health;
    /health /health;
    /health/ready /health/ready;
    ~^/api(?:/|$) /api;
    ~^/assets/ assets;
}

map $request_uri $scrapbook_robots {
    default "";
    ~^/e(?:[/?]|$) "noindex, nofollow";
    ~^/convites/aceitar(?:[/?]|$) "noindex, nofollow";
}

log_format scrapbook escape=json
    '{"route":"$scrapbook_route","statusCode":$status,"upstreamStatus":"$upstream_status",'
    '"requestTimeSeconds":$request_time,"correlationId":"$upstream_http_x_correlation_id"}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /dev/stdout scrapbook;
    error_log /dev/null;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag $scrapbook_robots always;

    resolver 127.0.0.11 ipv6=off valid=5s;

    location = /ui-health {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"up"}';
    }

    location ~ ^/(api(/.*)?|health(/ready)?)$ {
        set $api http://service:8080;
        proxy_connect_timeout 2s;
        proxy_read_timeout 12s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $api;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
